name: Torrly
options:
  bundleIdPrefix: com.sarvesh
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  TorrlyCore:
    path: Packages/TorrlyCore
targets:
  Torrly:
    type: application
    platform: iOS
    sources:
      - path: Torrly
    dependencies:
      - package: TorrlyCore
      - framework: Vendor/TorrlyEngine.xcframework
        embed: false
      - sdk: libc++.tbd
      - sdk: SystemConfiguration.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sarvesh.torrly
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_FILE: Torrly/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: ["-lc++"]
  TorrlyTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: TorrlyTests
    dependencies:
      - target: Torrly
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Torrly.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/Torrly
schemes:
  Torrly:
    build:
      targets:
        Torrly: all
        TorrlyTests: [test]
    test:
      targets:
        - TorrlyTests
